<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前踢動作分析系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        /* 基礎全螢幕設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        /* 鏡頭與畫布容器 (用於軟體縮放) */
        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transform-origin: center center;
            transition: transform 0.1s ease-out; /* 縮放平滑過渡 */
        }

        video, .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-panel, .bottom-panel {
            pointer-events: auto; 
            background: rgba(0, 0, 0, 0.65);
            padding: 15px;
            text-align: center;
            color: white;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(4px); 
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        button:active { background-color: #2980b9; transform: translateY(2px); }
        
        /* 變焦滑桿區塊 (改為預設顯示，使用軟體縮放) */
        .zoom-container {
            margin: 10px auto 0;
            width: 80%;
            max-width: 300px;
            display: none; /* 啟動後顯示 */
        }
        .zoom-container input[type=range] {
            width: 100%;
            margin-top: 5px;
        }

        #downloadBtn {
            background-color: #e67e22;
            display: none;
            margin: 10px auto 0 auto;
            width: fit-content;
        }
        
        .status-display {
            font-size: 18px;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 5px;
        }

        .angle-info {
            font-size: 24px;
            font-weight: bold;
        }

        #currentAngle { color: white; }
        #maxAngle { color: #f1c40f; font-size: 32px; }

        #screenshotImg {
            max-width: 40%;
            max-height: 20vh;
            border: 2px solid #f1c40f;
            border-radius: 8px;
            display: none;
            position: absolute;
            bottom: 130px;
            right: 15px;
            z-index: 30;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        #debugLog { font-size: 12px; color: #e74c3c; margin-top: 5px; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="camera-container" id="cameraContainer">
        <video id="videoElement" playsinline autoplay muted style="display:none;"></video>
        <canvas class="output_canvas"></canvas>
        <canvas id="buffer_canvas" style="display:none;"></canvas>
    </div>

    <div class="ui-layer">
        <div class="top-panel">
            <div class="controls">
                <button id="startBtn">啟動鏡頭</button>
                <button id="switchBtn">切換鏡頭</button>
            </div>
            
            <div class="zoom-container" id="zoomContainer">
                <label for="zoomSlider">🔍 調整畫面遠近：</label>
                <input type="range" id="zoomSlider" min="0.7" max="3" step="0.1" value="1">
            </div>

            <div class="status-display" id="statusText">等待啟動...</div>
            <div id="debugLog"></div>
        </div>

        <div class="bottom-panel">
            <div class="angle-info">目前角度: <span id="currentAngle">0</span>°</div>
            <div class="angle-info" id="finalAngleText">最高點角度: <span id="maxAngle">0</span>°</div>
            <button id="downloadBtn">⬇️ 下載截圖</button>
        </div>
    </div>

    <img id="screenshotImg" alt="截圖">

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const bufferCanvas = document.getElementById('buffer_canvas');
        const bufferCtx = bufferCanvas.getContext('2d');
        const cameraContainer = document.getElementById('cameraContainer');

        const currentAngleEl = document.getElementById('currentAngle');
        const statusTextEl = document.getElementById('statusText');
        const maxAngleEl = document.getElementById('maxAngle');
        const screenshotImg = document.getElementById('screenshotImg');
        const debugLog = document.getElementById('debugLog');
        
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const zoomContainer = document.getElementById('zoomContainer');
        const zoomSlider = document.getElementById('zoomSlider');

        let isKicking = false;
        let currentMaxAngle = 0;
        let useFrontCamera = false; 
        let currentStream = null;
        let poseLoaded = false;
        let isProcessingFrame = false; 

        // 鏡頭陣列與索引
        let videoDevices = [];
        let currentDeviceIndex = 0;
        let currentZoomLevel = 1.0;
        const MIN_ZOOM = 0.7; // 軟體廣角
        
        const START_KICK_THRESHOLD = 40; 
        const END_KICK_DROP = 15;        

        function calculateAngle(hip1, ankle1, hip2, ankle2) {
            const dx1 = ankle1.x - hip1.x;
            const dy1 = ankle1.y - hip1.y;
            const dx2 = ankle2.x - hip2.x;
            const dy2 = ankle2.y - hip2.y;

            const dotProduct = dx1 * dx2 + dy1 * dy2;
            const mag1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
            const mag2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

            if (mag1 === 0 || mag2 === 0) return 0;
            let angleRad = Math.acos(dotProduct / (mag1 * mag2));
            return angleRad * (180 / Math.PI);
        }

        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        pose.setOptions({
            modelComplexity: 1, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);
        pose.initialize().then(() => {
            poseLoaded = true;
            if(statusTextEl.innerText === "等待啟動...") {
                statusTextEl.innerText = "模型就緒，請點擊啟動";
            }
        });

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            bufferCanvas.width = videoElement.videoWidth;
            bufferCanvas.height = videoElement.videoHeight;
            
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // 若為前鏡頭則左右翻轉
            if (useFrontCamera) {
                canvasCtx.translate(canvasElement.width, 0);
                canvasCtx.scale(-1, 1);
            }
            
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2});

                const landmarks = results.poseLandmarks;
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const leftAnkle = landmarks[27];
                const rightAnkle = landmarks[28];

                if (leftHip.visibility > 0.5 && rightHip.visibility > 0.5 && 
                    leftAnkle.visibility > 0.5 && rightAnkle.visibility > 0.5) {
                    
                    let angle = Math.round(calculateAngle(leftHip, leftAnkle, rightHip, rightAnkle));
                    currentAngleEl.innerText = angle;

                    if (!isKicking && angle > START_KICK_THRESHOLD) {
                        isKicking = true;
                        currentMaxAngle = angle;
                        statusTextEl.innerText = "偵測中... (記錄中)";
                        statusTextEl.style.color = "#e74c3c"; 
                        downloadBtn.style.display = "none";
                        screenshotImg.style.display = "none";
                        
                        bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                        bufferCtx.drawImage(canvasElement, 0, 0);

                    } else if (isKicking) {
                        if (angle > currentMaxAngle) {
                            currentMaxAngle = angle;
                            bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                            bufferCtx.drawImage(canvasElement, 0, 0);
                        } else if (angle < currentMaxAngle - END_KICK_DROP) {
                            isKicking = false;
                            statusTextEl.innerText = "完成！可進行下一次";
                            statusTextEl.style.color = "#2ecc71"; 
                            
                            maxAngleEl.innerText = currentMaxAngle;
                            screenshotImg.src = bufferCanvas.toDataURL('image/jpeg', 0.9);
                            screenshotImg.style.display = "block";
                            downloadBtn.style.display = "block"; 
                            
                            currentMaxAngle = 0;
                        }
                    }
                }
            }
            canvasCtx.restore();
            isProcessingFrame = false; 
        }

        // 停止目前的攝影機串流
        function stopMediaTracks(stream) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }

        // 取得設備所有鏡頭並過濾
        async function getCameras() {
            try {
                // 先隨機請求一次權限，確保能拿到帶有 label 的完整設備清單 (iOS/Android 必備技巧)
                if (videoDevices.length === 0) {
                    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stopMediaTracks(tempStream);
                }

                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
                
                debugLog.innerText = `找到 ${videoDevices.length} 顆鏡頭`;
                console.log("所有鏡頭:", videoDevices);

                // 優先找「後置 / 廣角 / 標準鏡頭」，避開 tele(長焦) / zoom
                const preferred = videoDevices.findIndex(d => {
                    const label = d.label.toLowerCase();
                    return (label.includes('back') || label.includes('rear') || label.includes('environment')) &&
                           !label.includes('tele') &&
                           !label.includes('zoom');
                });

                currentDeviceIndex = preferred !== -1 ? preferred : 0;
            } catch (err) {
                console.error("獲取鏡頭列表失敗:", err);
                debugLog.innerText = "獲取鏡頭列表失敗";
            }
        }

        async function startCamera() {
            if (!poseLoaded) {
                alert("AI 尚未準備好，請稍等幾秒。");
                return;
            }

            statusTextEl.innerText = "正在啟動鏡頭...";
            
            if (currentStream) {
                stopMediaTracks(currentStream);
                videoElement.srcObject = null; 
                await new Promise(resolve => setTimeout(resolve, 200));
            }

            // 判斷當前選擇的鏡頭是否為前鏡頭 (為了鏡像翻轉)
            if (videoDevices[currentDeviceIndex]) {
                const label = videoDevices[currentDeviceIndex].label.toLowerCase();
                useFrontCamera = label.includes('front') || label.includes('user') || label.includes('selfie');
            }

            // 使用精準的 deviceId 呼叫，不再依賴 facingMode
            const constraints = {
                video: {
                    deviceId: videoDevices[currentDeviceIndex] ? { exact: videoDevices[currentDeviceIndex].deviceId } : undefined,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                await videoElement.play();
                
                statusTextEl.innerText = `已啟動 (${useFrontCamera ? '前' : '後'}鏡頭)`;
                startBtn.style.display = "none"; 
                zoomContainer.style.display = "block"; // 顯示軟體變焦滑桿
                
                requestAnimationFrame(processFrame);
                
            } catch (err) {
                debugLog.innerText = "錯誤: " + err.name + " - " + err.message;
                alert("無法存取此鏡頭！請嘗試點擊切換鏡頭。");
            }
        }

        async function processFrame() {
            if (!videoElement.paused && !videoElement.ended && !isProcessingFrame) {
                isProcessingFrame = true;
                await pose.send({image: videoElement});
            }
            requestAnimationFrame(processFrame);
        }

        // 綁定事件：啟動前先抓鏡頭列表
        startBtn.addEventListener('click', async () => {
            await getCameras();
            startCamera();
        });

        // 綁定事件：依序切換可用鏡頭
        switchBtn.addEventListener('click', async () => {
            if (videoDevices.length === 0) {
                await getCameras();
            }

            if (videoDevices.length > 1) {
                currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
                statusTextEl.innerText = "切換鏡頭中...";
                await startCamera();
            } else {
                alert("找不到其他鏡頭可供切換");
            }
        });

        // 軟體縮放事件綁定 (透過 CSS Transform 達成偽廣角與變焦)
        zoomSlider.addEventListener('input', (e) => {
            currentZoomLevel = parseFloat(e.target.value);
            // 套用縮放到整個容器，這樣原始影像與 AI 骨架線條會等比例完美縮放
            cameraContainer.style.transform = `scale(${currentZoomLevel})`;
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `kick_${maxAngleEl.innerText}deg.jpg`;
            link.href = screenshotImg.src;
            link.click();
        });

    </script>
</body>
</html>
