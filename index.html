<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前踢動作分析系統 (專業VAR版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }
        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            transform-origin: center center;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            background-color: #000;
        }
        .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top-panel, .bottom-panel {
            pointer-events: auto; 
            background: rgba(0, 0, 0, 0.65);
            padding: 15px;
            text-align: center;
            color: white;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            font-weight: bold;
            transition: background 0.2s;
        }
        button:active { transform: translateY(2px); }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        
        #kickBtn {
            background-color: #e74c3c;
            display: none;
            font-size: 18px;
            padding: 15px 30px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        select {
            padding: 10px;
            font-size: 16px;
            background-color: #2c3e50;
            color: white;
            border: 2px solid #3498db;
            border-radius: 8px;
            outline: none;
            max-width: 80%;
            display: none; 
        }
        .zoom-container {
            margin: 10px auto 0;
            width: 80%;
            max-width: 300px;
            display: none; 
        }
        .zoom-container input[type=range] { width: 100%; margin-top: 5px; }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        #downloadBtn { background-color: #f39c12; display: none; }
        #downloadVideoBtn { background-color: #9b59b6; display: none; }
        
        .status-display {
            font-size: 18px;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 5px;
            min-height: 24px;
        }
        .angle-info { font-size: 24px; font-weight: bold; }
        #currentAngle { color: white; }
        #maxAngle { color: #f1c40f; font-size: 32px; }
        
        /* 截圖與影片預覽區 */
        .preview-container {
            position: absolute;
            bottom: 150px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            z-index: 30;
        }
        #screenshotImg {
            max-width: 150px;
            border: 2px solid #f1c40f;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            background-color: #000;
        }
        #replayVideo {
            max-width: 150px;
            border: 2px solid #9b59b6;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="camera-container" id="cameraContainer">
        <video id="videoElement" playsinline autoplay muted style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; pointer-events:none;"></video>
        <canvas class="output_canvas"></canvas>
        <canvas id="buffer_canvas" style="display:none;"></canvas>
    </div>

    <div class="ui-layer">
        <div class="top-panel">
            <div class="controls">
                <button id="startBtn">啟動鏡頭</button>
                <select id="cameraSelect"></select>
                <button id="kickBtn">🥋 按下開始錄影測量</button>
            </div>
            <div class="zoom-container" id="zoomContainer">
                <label for="zoomSlider">🔍 調整畫面遠近：</label>
                <input type="range" id="zoomSlider" min="0.7" max="3" step="0.1" value="1">
            </div>
            <div class="status-display" id="statusText">等待啟動...</div>
        </div>
        <div class="bottom-panel">
            <div class="angle-info">目前角度: <span id="currentAngle">0</span>°</div>
            <div class="angle-info" id="finalAngleText">真實最高點: <span id="maxAngle">0</span>°</div>
            <div class="action-buttons">
                <button id="downloadBtn">📸 下載最高點截圖</button>
                <button id="downloadVideoBtn">🎬 下載5倍慢動作影片</button>
            </div>
        </div>
    </div>

    <div class="preview-container">
        <img id="screenshotImg" alt="截圖">
        <video id="replayVideo" autoplay loop muted playsinline></video>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const bufferCanvas = document.getElementById('buffer_canvas');
        const bufferCtx = bufferCanvas.getContext('2d');
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');

        const cameraContainer = document.getElementById('cameraContainer');
        const currentAngleEl = document.getElementById('currentAngle');
        const statusTextEl = document.getElementById('statusText');
        const maxAngleEl = document.getElementById('maxAngle');
        
        const screenshotImg = document.getElementById('screenshotImg');
        const replayVideo = document.getElementById('replayVideo');
        
        const startBtn = document.getElementById('startBtn');
        const cameraSelect = document.getElementById('cameraSelect'); 
        const kickBtn = document.getElementById('kickBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadVideoBtn = document.getElementById('downloadVideoBtn');
        const zoomSlider = document.getElementById('zoomSlider');

        let useFrontCamera = false; 
        let currentStream = null;
        let videoDevices = [];
        let currentDeviceIndex = 0;
        let poseLoaded = false;
        let isProcessingFrame = false; 
        let isCameraSwitching = false; 

        // ⭐ 錄影與檢定相關變數
        let mediaRecorder = null;
        let recordedChunks = [];
        let preBufferChunks = [];    // 預錄緩衝區（按鍵前2秒）
        let isPreBuffering = false;  // 是否正在預錄
        let videoBlobUrl = null;
        
        let isRecording = false;     // 是否已按下踢擊按鈕，開始正式錄影
        let hasLiftedOff = false;    // 腳是否已經離地 (開始動作)
        let bestFrameDataUrl = null;
        let bestAngle = 0;

        // 判斷腳離地的嚴格門檻：兩腳踝 Y 軸差距需大於畫面高度的 8%
        const LIFT_THRESHOLD = 0.08;
        const PRE_BUFFER_DURATION = 2000; // 預錄2秒緩衝（毫秒）

        function calculate3DAngle(hip1, ankle1, hip2, ankle2, canvasW, canvasH) {
            const dx1 = (ankle1.x - hip1.x) * canvasW;
            const dy1 = (ankle1.y - hip1.y) * canvasH;
            const dz1 = (ankle1.z - hip1.z) * canvasW; 
            const dx2 = (ankle2.x - hip2.x) * canvasW;
            const dy2 = (ankle2.y - hip2.y) * canvasH;
            const dz2 = (ankle2.z - hip2.z) * canvasW; 
            
            const dotProduct = dx1 * dx2 + dy1 * dy2 + dz1 * dz2;
            const mag1 = Math.sqrt(dx1 * dx1 + dy1 * dy1 + dz1 * dz1);
            const mag2 = Math.sqrt(dx2 * dx2 + dy2 * dy2 + dz2 * dz2);
            if (mag1 === 0 || mag2 === 0) return 0;
            return Math.acos(dotProduct / (mag1 * mag2)) * (180 / Math.PI);
        }

        function captureMaxPointFrame(landmarks, angle) {
            if (videoElement.readyState < 2 || videoElement.videoWidth === 0) return;
            tempCanvas.width = videoElement.videoWidth;
            tempCanvas.height = videoElement.videoHeight;
            tempCtx.drawImage(videoElement, 0, 0, tempCanvas.width, tempCanvas.height);

            bufferCanvas.width = videoElement.videoWidth;
            bufferCanvas.height = videoElement.videoHeight;
            bufferCtx.save();
            if (useFrontCamera) {
                bufferCtx.translate(bufferCanvas.width, 0);
                bufferCtx.scale(-1, 1);
            }
            bufferCtx.drawImage(tempCanvas, 0, 0, bufferCanvas.width, bufferCanvas.height);
            bufferCtx.fillStyle = "rgba(0,0,0,0.5)";
            bufferCtx.fillRect(0, 0, bufferCanvas.width, bufferCanvas.height);
            if (landmarks) {
                drawConnectors(bufferCtx, landmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(bufferCtx, landmarks, {color: '#FF0000', lineWidth: 2});
            }
            bufferCtx.restore();

            bufferCtx.fillStyle = "rgba(0,0,0,0.6)";
            bufferCtx.fillRect(20, 20, 250, 60); 
            bufferCtx.fillStyle = "#f1c40f";
            bufferCtx.font = "bold 42px Arial";
            bufferCtx.fillText(`MAX: ${angle}°`, 35, 65); 

            bestFrameDataUrl = bufferCanvas.toDataURL('image/jpeg', 0.9);
            bestAngle = angle;
        }

        // 🎬 預錄緩衝區（鏡頭啟動後即開始，持續把最近2秒存起來）
        function startPreBuffer() {
            if (isPreBuffering) return;
            isPreBuffering = true;
            preBufferChunks = [];

            const stream = canvasElement.captureStream(30);

            // 選擇最佳編碼格式
            let mimeType = '';
            const candidates = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4',
            ];
            for (const c of candidates) {
                if (MediaRecorder.isTypeSupported(c)) { mimeType = c; break; }
            }

            try {
                const options = mimeType ? { mimeType } : {};
                // 預錄器：每100ms取一段，滾動保留最近2秒
                const preRecorder = new MediaRecorder(stream, options);
                preRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        preBufferChunks.push({ chunk: e.data, time: Date.now() });
                        // 只保留最近 PRE_BUFFER_DURATION 毫秒的資料
                        const cutoff = Date.now() - PRE_BUFFER_DURATION;
                        preBufferChunks = preBufferChunks.filter(c => c.time >= cutoff);
                    }
                };
                preRecorder.start(100); // 每100ms產生一個chunk
                window._preRecorder = preRecorder;
                window._preStream = stream;
                window._preMimeType = mimeType;
            } catch (e) {
                console.error("預錄啟動失敗", e);
                isPreBuffering = false;
            }
        }

        // 🎬 正式開始錄製（合併預錄緩衝 + 繼續錄製）
        function startMediaRecording() {
            recordedChunks = [];

            // 先把預錄緩衝區的 chunk 加進來（包含踢之前的動作）
            const bufferedData = preBufferChunks.map(c => c.chunk);
            recordedChunks = [...bufferedData];

            // 停掉預錄器，接著用正式 recorder 繼續同一條 stream
            const stream = window._preStream || canvasElement.captureStream(30);
            const mimeType = window._preMimeType || '';

            if (window._preRecorder && window._preRecorder.state !== 'inactive') {
                window._preRecorder.stop();
            }
            isPreBuffering = false;

            try {
                const options = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                console.error("MediaRecorder 建立失敗", e);
                // 重新啟動預錄
                setTimeout(startPreBuffer, 500);
                return;
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                // 將錄好的片段轉為影片
                const usedMime = mimeType || 'video/webm';
                const blob = new Blob(recordedChunks, { type: usedMime });
                if (videoBlobUrl) URL.revokeObjectURL(videoBlobUrl);
                videoBlobUrl = URL.createObjectURL(blob);
                
                // 設定 5 倍慢動作（必須在 canplay 後設定才生效）
                replayVideo.src = '';
                replayVideo.load();
                replayVideo.src = videoBlobUrl;

                const setSlowMo = () => {
                    replayVideo.playbackRate = 0.2;
                    replayVideo.play().catch(() => {});
                };
                replayVideo.addEventListener('canplay', setSlowMo, { once: true });
                // 備援：直接設定也試一次
                replayVideo.playbackRate = 0.2;

                replayVideo.style.display = "block";
                downloadVideoBtn.style.display = "block";

                // 錄完後重新啟動預錄緩衝，為下一次做準備
                setTimeout(startPreBuffer, 300);

                // 顯示最高點截圖
                if (bestFrameDataUrl) {
                    screenshotImg.src = bestFrameDataUrl;
                    screenshotImg.style.display = "block";
                    downloadBtn.style.display = "block";
                    maxAngleEl.innerText = bestAngle;
                }
                
                statusTextEl.innerText = "✅ 測量完成！(下方為5倍慢動作)";
                statusTextEl.style.color = "#2ecc71";
                kickBtn.disabled = false;
                kickBtn.innerText = "🥋 再測一次";
            };

            mediaRecorder.start(100); // 每100ms收集一次，確保資料持續累積
        }

        // 🛑 停止錄製
        function stopMediaRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        // 🥋 按下踢擊按鈕：清除狀態，開始錄影
        kickBtn.addEventListener('click', () => {
            if (!poseLoaded) return;
            isRecording = true;
            hasLiftedOff = false;
            bestAngle = 0;
            bestFrameDataUrl = null;

            screenshotImg.style.display = "none";
            replayVideo.style.display = "none";
            downloadBtn.style.display = "none";
            downloadVideoBtn.style.display = "none";
            maxAngleEl.innerText = "0";

            kickBtn.disabled = true;
            kickBtn.innerText = "錄影中...";
            statusTextEl.innerText = "🔴 錄影中... 請起腳踢擊！";
            statusTextEl.style.color = "#e74c3c";

            startMediaRecording();
        });


        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        pose.setOptions({
            modelComplexity: 1, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);
        pose.initialize().then(() => {
            poseLoaded = true;
            if(statusTextEl.innerText === "等待啟動...") {
                statusTextEl.innerText = "模型就緒，請點擊啟動";
            }
        });

        function onResults(results) {
            if (isCameraSwitching) return;

            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (useFrontCamera) {
                canvasCtx.translate(canvasElement.width, 0);
                canvasCtx.scale(-1, 1);
            }
            
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2});

                const landmarks = results.poseLandmarks;
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const leftAnkle = landmarks[27];
                const rightAnkle = landmarks[28];

                if (leftHip.visibility > 0.2 && rightHip.visibility > 0.2 && 
                    leftAnkle.visibility > 0.2 && rightAnkle.visibility > 0.2) {
                    
                    let rawAngle = Math.round(calculate3DAngle(leftHip, leftAnkle, rightHip, rightAnkle, canvasElement.width, canvasElement.height));
                    currentAngleEl.innerText = rawAngle;

                    // ⭐ 嚴格判定邏輯 (必須按下按鈕才啟動)
                    if (isRecording) {
                        // 兩腳的 Y 軸差距 (判定一腳踩死，一腳離地)
                        const ankleYDiff = Math.abs(leftAnkle.y - rightAnkle.y);

                        // 階段 1: 等待起腳 (一腳離地)
                        if (!hasLiftedOff && ankleYDiff > LIFT_THRESHOLD) {
                            hasLiftedOff = true; 
                            statusTextEl.innerText = "🚀 動作開始！尋找最高點...";
                        }

                        // 階段 2: 已經起腳，正在空中踢擊
                        if (hasLiftedOff) {
                            // 只要角度創新高，就無條件截圖覆蓋 (因為錄影範圍內絕對安全)
                            if (rawAngle > bestAngle) {
                                bestAngle = rawAngle;
                                captureMaxPointFrame(landmarks, bestAngle);
                            }

                            // 階段 3: 踢完腳放下 (著地)
                            if (ankleYDiff < LIFT_THRESHOLD) {
                                isRecording = false;
                                hasLiftedOff = false;
                                statusTextEl.innerText = "🛑 腳已著地，結束錄影...";
                                stopMediaRecording(); // 停止錄影，觸發結算
                            }
                        }
                    }
                }
            }
            canvasCtx.restore();
        }

        // --- 鏡頭與下載相關邏輯 --- 
        function stopMediaTracks(stream) {
            if (stream) stream.getTracks().forEach(track => track.stop());
        }

        async function getCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoDevices = devices.filter(d => d.kind === 'videoinput');
                cameraSelect.innerHTML = "";
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.text = device.label || `未命名鏡頭 ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                cameraSelect.style.display = "inline-block";
            } catch (err) {
                console.error("獲取鏡頭列表失敗:", err);
            }
        }

        async function startCamera() {
            isCameraSwitching = true; 
            if (currentStream) {
                stopMediaTracks(currentStream);
            }
            const device = videoDevices[currentDeviceIndex];
            const deviceId = device ? { exact: device.deviceId } : undefined;
            if (device) {
                useFrontCamera = device.label.toLowerCase().includes('front');
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: deviceId, width: { ideal: 1280 }, height: { ideal: 720 } } });
                videoElement.srcObject = currentStream;
                await videoElement.play();
                
                startBtn.style.display = "none"; 
                zoomContainer.style.display = "block"; 
                kickBtn.style.display = "block"; // 顯示踢擊按鈕
                statusTextEl.innerText = `鏡頭就緒，請準備`;
                statusTextEl.style.color = "#2ecc71";

                // 鏡頭啟動後立即開始預錄緩衝，確保動作前有充足畫面
                setTimeout(startPreBuffer, 500);
            } catch (err) {
                alert("鏡頭啟動失敗");
            }
            isCameraSwitching = false; 
            requestAnimationFrame(processFrame);
        }

        async function processFrame() {
            if (!videoElement.paused && !videoElement.ended && !isProcessingFrame && !isCameraSwitching) {
                isProcessingFrame = true;
                await pose.send({image: videoElement});
                isProcessingFrame = false; 
            }
            requestAnimationFrame(processFrame);
        }

        startBtn.addEventListener('click', async () => {
            await getCameras();
            await startCamera();
        });

        cameraSelect.addEventListener('change', async (e) => {
            currentDeviceIndex = parseInt(e.target.value);
            await startCamera();
        });

        zoomSlider.addEventListener('input', (e) => {
            cameraContainer.style.transform = `scale(${e.target.value})`;
        });

        // 下載截圖
        downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = `kick_peak_${bestAngle}deg.jpg`;
            link.href = bestFrameDataUrl;
            link.click();
        };

        // 下載影片
        downloadVideoBtn.onclick = () => {
            if (!videoBlobUrl) return;
            const link = document.createElement('a');
            link.download = `kick_slowmo_${bestAngle}deg.webm`;
            link.href = videoBlobUrl;
            link.click();
        };

    </script>
</body>
</html>
