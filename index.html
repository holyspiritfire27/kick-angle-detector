<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前踢動作分析系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        /* 基礎全螢幕設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        .camera-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* contain 確保畫面比例正確，不被裁切 */
        video, .output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-panel, .bottom-panel {
            pointer-events: auto; 
            background: rgba(0, 0, 0, 0.65);
            padding: 15px;
            text-align: center;
            color: white;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(4px); 
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            font-weight: bold;
            min-width: 120px;
        }

        button:active { background-color: #2980b9; transform: translateY(2px); }
        
        #downloadBtn {
            background-color: #e67e22;
            display: none;
            margin: 10px auto 0 auto;
            width: fit-content;
        }
        
        .status-display {
            font-size: 18px;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 5px;
        }

        .angle-info {
            font-size: 24px;
            font-weight: bold;
        }

        #currentAngle { color: white; }
        #maxAngle { color: #f1c40f; font-size: 32px; }

        #screenshotImg {
            max-width: 40%;
            max-height: 20vh;
            border: 2px solid #f1c40f;
            border-radius: 8px;
            display: none;
            position: absolute;
            bottom: 120px;
            right: 15px;
            z-index: 30;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        #debugLog { font-size: 12px; color: #e74c3c; margin-top: 5px; }
        
        /* 新增縮放控制區域 */
        .zoom-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .zoom-btn {
            padding: 8px 15px;
            font-size: 20px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #zoomLevel {
            font-size: 18px;
            min-width: 60px;
        }
        
        /* 適配手機按鈕大小 */
        @media (max-width: 480px) {
            button {
                padding: 10px 15px;
                font-size: 14px;
                min-width: 100px;
            }
            
            .zoom-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            
            .angle-info {
                font-size: 20px;
            }
            
            #maxAngle {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="videoElement" playsinline autoplay muted style="display:none;"></video>
        <canvas class="output_canvas"></canvas>
        <canvas id="buffer_canvas" style="display:none;"></canvas>
    </div>

    <div class="ui-layer">
        <div class="top-panel">
            <div class="controls">
                <button id="startBtn">啟動鏡頭</button>
                <button id="switchBtn">切換鏡頭</button>
            </div>
            <!-- 新增縮放控制按鈕 -->
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOutBtn">-</button>
                <span id="zoomLevel">1.0x</span>
                <button class="zoom-btn" id="zoomInBtn">+</button>
            </div>
            <div class="status-display" id="statusText">等待啟動...</div>
            <div id="debugLog"></div>
        </div>

        <div class="bottom-panel">
            <div class="angle-info">目前角度: <span id="currentAngle">0</span>°</div>
            <div class="angle-info" id="finalAngleText">最高點角度: <span id="maxAngle">0</span>°</div>
            <button id="downloadBtn">⬇️ 下載截圖</button>
        </div>
    </div>

    <img id="screenshotImg" alt="截圖">

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const bufferCanvas = document.getElementById('buffer_canvas');
        const bufferCtx = bufferCanvas.getContext('2d');

        const currentAngleEl = document.getElementById('currentAngle');
        const statusTextEl = document.getElementById('statusText');
        const maxAngleEl = document.getElementById('maxAngle');
        const screenshotImg = document.getElementById('screenshotImg');
        const debugLog = document.getElementById('debugLog');
        const zoomLevelEl = document.getElementById('zoomLevel');
        
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let isKicking = false;
        let currentMaxAngle = 0;
        let useFrontCamera = false; // 預設使用後鏡頭
        let currentStream = null;
        let poseLoaded = false;
        let isProcessingFrame = false;
        let currentZoomLevel = 1.0; // 預設縮放倍數
        const MIN_ZOOM = 0.5; // 最小縮放 (更廣角)
        const MAX_ZOOM = 3.0; // 最大縮放
        const ZOOM_STEP = 0.1; // 每次調整步數
        
        const START_KICK_THRESHOLD = 40; 
        const END_KICK_DROP = 15;        

        function calculateAngle(hip1, ankle1, hip2, ankle2) {
            const dx1 = ankle1.x - hip1.x;
            const dy1 = ankle1.y - hip1.y;
            const dx2 = ankle2.x - hip2.x;
            const dy2 = ankle2.y - hip2.y;

            const dotProduct = dx1 * dx2 + dy1 * dy2;
            const mag1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
            const mag2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);

            if (mag1 === 0 || mag2 === 0) return 0;
            let angleRad = Math.acos(dotProduct / (mag1 * mag2));
            return angleRad * (180 / Math.PI);
        }

        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        pose.setOptions({
            modelComplexity: 1, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);
        pose.initialize().then(() => {
            poseLoaded = true;
            if(statusTextEl.innerText === "等待啟動...") {
                statusTextEl.innerText = "模型就緒，請點擊啟動";
            }
        });

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            bufferCanvas.width = videoElement.videoWidth;
            bufferCanvas.height = videoElement.videoHeight;
            
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            if (useFrontCamera) {
                canvasCtx.translate(canvasElement.width, 0);
                canvasCtx.scale(-1, 1);
            }
            
            // 應用縮放效果
            canvasCtx.translate(canvasElement.width / 2, canvasElement.height / 2);
            canvasCtx.scale(currentZoomLevel, currentZoomLevel);
            canvasCtx.translate(-canvasElement.width / 2, -canvasElement.height / 2);
            
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                // 繪製骨架時也要考慮縮放
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 4 / currentZoomLevel});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 2 / currentZoomLevel});

                const landmarks = results.poseLandmarks;
                const leftHip = landmarks[23];
                const rightHip = landmarks[24];
                const leftAnkle = landmarks[27];
                const rightAnkle = landmarks[28];

                if (leftHip.visibility > 0.5 && rightHip.visibility > 0.5 && 
                    leftAnkle.visibility > 0.5 && rightAnkle.visibility > 0.5) {
                    
                    let angle = Math.round(calculateAngle(leftHip, leftAnkle, rightHip, rightAnkle));
                    currentAngleEl.innerText = angle;

                    if (!isKicking && angle > START_KICK_THRESHOLD) {
                        isKicking = true;
                        currentMaxAngle = angle;
                        statusTextEl.innerText = "偵測中... (記錄中)";
                        statusTextEl.style.color = "#e74c3c"; 
                        downloadBtn.style.display = "none";
                        screenshotImg.style.display = "none";
                        
                        bufferCtx.save();
                        bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                        // 緩存畫布也應用相同縮放
                        bufferCtx.translate(bufferCanvas.width / 2, bufferCanvas.height / 2);
                        bufferCtx.scale(currentZoomLevel, currentZoomLevel);
                        bufferCtx.translate(-bufferCanvas.width / 2, -bufferCanvas.height / 2);
                        bufferCtx.drawImage(canvasElement, 0, 0);
                        bufferCtx.restore();

                    } else if (isKicking) {
                        if (angle > currentMaxAngle) {
                            currentMaxAngle = angle;
                            bufferCtx.save();
                            bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                            bufferCtx.translate(bufferCanvas.width / 2, bufferCanvas.height / 2);
                            bufferCtx.scale(currentZoomLevel, currentZoomLevel);
                            bufferCtx.translate(-bufferCanvas.width / 2, -bufferCanvas.height / 2);
                            bufferCtx.drawImage(canvasElement, 0, 0);
                            bufferCtx.restore();
                        } else if (angle < currentMaxAngle - END_KICK_DROP) {
                            isKicking = false;
                            statusTextEl.innerText = "完成！可進行下一次";
                            statusTextEl.style.color = "#2ecc71"; 
                            
                            maxAngleEl.innerText = currentMaxAngle;
                            
                            screenshotImg.src = bufferCanvas.toDataURL('image/jpeg', 0.9);
                            screenshotImg.style.display = "block";
                            downloadBtn.style.display = "block"; 
                            
                            currentMaxAngle = 0;
                        }
                    }
                }
            }
            canvasCtx.restore();
            isProcessingFrame = false; 
        }

        // 更新縮放顯示
        function updateZoomDisplay() {
            zoomLevelEl.textContent = `${currentZoomLevel.toFixed(1)}x`;
        }

        // 調整鏡頭縮放 (軟體縮放，兼容所有裝置)
        function adjustZoom(direction) {
            if (direction === 'in') {
                currentZoomLevel = Math.min(currentZoomLevel + ZOOM_STEP, MAX_ZOOM);
            } else {
                currentZoomLevel = Math.max(currentZoomLevel - ZOOM_STEP, MIN_ZOOM);
            }
            updateZoomDisplay();
        }

        async function startCamera() {
            if (!poseLoaded) {
                alert("AI 尚未準備好，請稍等幾秒。");
                return;
            }

            debugLog.innerText = "正在請求鏡頭...";
            
            // 徹底關閉並清空先前的鏡頭連線，避免切換時當機
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                videoElement.srcObject = null; 
            }

            // 調整鏡頭解析度，避免過度放大
            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment",
                    width: { ideal: 640, max: 1280 },
                    height: { ideal: 480, max: 720 },
                    // 避免系統自動放大，要求最廣角
                    zoom: { ideal: 1.0 },
                    // 要求最廣角的視野
                    fieldOfView: { ideal: 90 },
                    // 要求使用主鏡頭而非變焦鏡頭
                    deviceId: { exact: undefined }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                
                // 檢查是否支援相機控制
                const videoTrack = currentStream.getVideoTracks()[0];
                const capabilities = videoTrack.getCapabilities();
                
                debugLog.innerText = "支援功能: " + Object.keys(capabilities).join(', ');
                
                // 重置為最廣角 (軟體縮放)
                currentZoomLevel = MIN_ZOOM;
                updateZoomDisplay();
                
                // 檢查是否支援硬體縮放
                if (capabilities.zoom) {
                    debugLog.innerText += " (支援硬體縮放)";
                    // 嘗試設置為最廣角
                    try {
                        await videoTrack.applyConstraints({
                            advanced: [{ zoom: capabilities.zoom.min || 1.0 }]
                        });
                        currentZoomLevel = capabilities.zoom.min || 1.0;
                    } catch (err) {
                        debugLog.innerText += " (硬體縮放失敗，使用軟體縮放)";
                    }
                }
                
                await videoElement.play();
                
                statusTextEl.innerText = `已啟動 (${useFrontCamera ? '前' : '後'}鏡頭)`;
                debugLog.innerText = "";
                startBtn.style.display = "none"; 
                updateZoomDisplay();
                
                requestAnimationFrame(processFrame);
                
            } catch (err) {
                debugLog.innerText = "錯誤: " + err.name + " - " + err.message;
                alert("無法存取鏡頭！錯誤代碼：" + err.name + "。請確認您未在其他APP開啟相機。");
                
                // 如果後鏡頭開啟失敗，自動切換到前鏡頭
                if (!useFrontCamera && err.name === 'NotAllowedError') {
                    useFrontCamera = true;
                    statusTextEl.innerText = "後鏡頭開啟失敗，請改用前鏡頭";
                    debugLog.innerText += " (建議使用前鏡頭)";
                }
            }
        }

        async function processFrame() {
            if (!videoElement.paused && !videoElement.ended && !isProcessingFrame) {
                isProcessingFrame = true;
                await pose.send({image: videoElement});
            }
            requestAnimationFrame(processFrame);
        }

        // 初始化事件監聽
        startBtn.addEventListener('click', startCamera);

        // 改進的鏡頭切換邏輯
        switchBtn.addEventListener('click', async () => {
            useFrontCamera = !useFrontCamera;
            statusTextEl.innerText = `切換為${useFrontCamera ? '前' : '後'}鏡頭中...`;
            
            // 不論是否已啟動，都重新初始化相機
            try {
                await startCamera();
            } catch (err) {
                statusTextEl.innerText = `切換失敗，請手動點擊啟動`;
                debugLog.innerText = "切換錯誤: " + err.message;
            }
        });

        // 初始化縮放按鈕 (預設軟體縮放)
        zoomInBtn.addEventListener('click', () => adjustZoom('in'));
        zoomOutBtn.addEventListener('click', () => adjustZoom('out'));

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `kick_${maxAngleEl.innerText}deg_${currentZoomLevel.toFixed(1)}x.jpg`;
            link.href = screenshotImg.src;
            link.click();
        });

        // 處理頁面隱藏/顯示事件，避免鏡頭中斷
        document.addEventListener('visibilitychange', async () => {
            if (document.hidden) {
                // 頁面隱藏時停止處理
                isProcessingFrame = true;
            } else if (currentStream && !videoElement.paused) {
                // 頁面恢復時重新啟動處理
                isProcessingFrame = false;
            }
        });

        // 頁面加載完成後，立即檢查相機權限
        window.addEventListener('load', async () => {
            try {
                const permissions = await navigator.permissions.query({name: 'camera'});
                if (permissions.state === 'granted') {
                    statusTextEl.innerText = "相機權限已獲得，點擊啟動";
                } else if (permissions.state === 'denied') {
                    statusTextEl.innerText = "相機權限被拒絕，請開啟權限";
                    statusTextEl.style.color = "#e74c3c";
                }
            } catch (err) {
                // 某些瀏覽器不支援 permissions API
            }
        });

    </script>
</body>
</html>
